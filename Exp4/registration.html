<div id="alertContainer" class="container mt-3"></div><div class="container py-5"><div class="row justify-content-center"><div class="col-sm-12 col-md-8 col-lg-6"><form id="registrationForm" class="form-card" onsubmit="validateAndRegisterUser(event)">
<h2 class="text-center mb-4">Registration</h2>
<div class="mb-3"><label class="form-label">Full Name</label><input id="regName" type="text" class="form-control"><div class="text-danger small" id="errName"></div></div>
<div class="mb-3"><label class="form-label">Email</label><input id="regEmail" type="text" class="form-control"><div class="text-danger small" id="errEmail"></div></div>
<div class="mb-3"><label class="form-label">Mobile Number</label><input id="regPhone" type="text" class="form-control"><div class="text-danger small" id="errPhone"></div></div>
<div class="row"><div class="col-sm-12 col-md-6 mb-3"><label class="form-label">Password</label><input id="regPassword" type="password" class="form-control"><div class="text-danger small" id="errPassword"></div></div><div class="col-sm-12 col-md-6 mb-3"><label class="form-label">Confirm Password</label><input id="regConfirmPassword" type="password" class="form-control"><div class="text-danger small" id="errConfirmPassword"></div></div></div>
<div class="mb-3"><label class="form-label d-block">Gender</label><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Male" id="genderMale"><label class="form-check-label" for="genderMale">Male</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Female" id="genderFemale"><label class="form-check-label" for="genderFemale">Female</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" value="Other" id="genderOther"><label class="form-check-label" for="genderOther">Other</label></div><div class="text-danger small" id="errGender"></div></div>
<div class="mb-3"><label class="form-label">Date of Birth</label><input type="date" class="form-control"></div>
<div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" rows="3" oninput="updateCharCount(this, 'addressCharCount')"></textarea><div class="small text-muted mt-1" id="addressCharCount">Characters: <strong>0</strong> | Words: <strong>0</strong></div></div>
<div class="mb-3"><label class="form-label">Preferred Destination</label><select class="form-select"><option>Goa</option><option>Manali</option><option>Kashmir</option><option>Kerala</option><option>Jaipur</option><option>Andaman</option><option>Ladakh</option></select></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="regTerms"><label class="form-check-label" for="regTerms">I accept Terms & Conditions</label><div class="text-danger small" id="errTerms"></div></div>
<button type="submit" class="btn btn-primary">Register</button> <button type="reset" class="btn btn-secondary">Reset</button></form></div></div></div><footer class="bg-dark text-white text-center p-3 mt-5"><p class="mb-0">&copy; 2026 Travelease | Tourism & Travel Website</p></footer>
