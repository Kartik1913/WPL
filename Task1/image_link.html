<!DOCTYPE html>
<html>
<head>
    <title>Image Link</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; }
        img { width: 350px; height: auto; border: 5px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: transform 0.3s; border-radius: 10px; }
        img:hover { transform: scale(1.05); }
        .container { text-align: center; }
        p { font-family: sans-serif; color: #555; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://www.google.com">
            <img src="https://cdn.pixabay.com/photo/2019/06/11/08/55/lotus-4266522_1280.jpg" alt="Click to open Google">
        </a>
        <p>Click image to open Google</p>
    </div>
</body>
</html>
