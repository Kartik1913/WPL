<html>
<head>
    <title>Frameset Example</title>
</head>
<frameset cols="25%, 75%">

    <frameset rows="33%, 33%, 34%">
        <frame src="blank.html" name="topRight">
        <frame src="blank.html" name="midRight">
        <frame src="blank.html" name="botRight">
    </frameset>
</frameset>
</html>
