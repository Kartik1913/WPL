<!DOCTYPE html>
<html>
<head>
    <title>AVENGERS ASSEMBLE</title>
    <style>
        body { background-color: #1a1a2e; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; text-align: center; }
        h1.main-title { color: #e62429; text-transform: uppercase; border-bottom: 2px solid #e62429; display: inline-block; padding-bottom: 10px; }
        .form-container { background: #162447; padding: 20px; border-radius: 8px; margin: 20px auto; width: 80%; max-width: 500px; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input[type="text"], input[type="range"] { width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; border-radius: 4px; border: none; }
        button { background-color: #e62429; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; width: 100%; margin-top: 15px; }
        button:hover { background-color: #ff3338; }
        .headings { text-align: left; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 500px; }
    </style>
</head>
<body>
    <h1 class="main-title">AVENGERS ASSEMBLE</h1>
    <br>
    <img src="https://images.unsplash.com/photo-1608889175250-c3b0c1667d3a?q=80&w=400&auto=format&fit=crop" alt="Avenger" style="border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); margin-bottom: 20px;">
    
    <div class="headings">
        <h1>H1: Iron Man</h1>
        <h2>H2: Captain America</h2>
        <h3>H3: Thor</h3>
        <h4>H4: Hulk</h4>
        <h5>H5: Black Widow</h5>
        <h6>H6: Hawkeye</h6>
    </div>

    <div class="form-container">
        <h3>Join the Avengers Initiative</h3>
        <form action="#" method="get">
            <label for="name">Recruit Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br>
            
            <label for="powerLevel">Power Level (1-100):</label>
            <input type="range" id="powerLevel" name="powerLevel" min="1" max="100"><br>
            
            <p>Select your skills:</p>
            <input type="checkbox" id="combat" name="combat" value="Combat">
            <label for="combat">Hand-to-Hand Combat</label><br>
            <input type="checkbox" id="tech" name="tech" value="Tech">
            <label for="tech">Technology Expert</label><br>
            <input type="checkbox" id="magic" name="magic" value="Magic">
            <label for="magic">Mystic Arts</label><br>
            
            <button type="button">Submit Application</button>
        </form>
    </div>
</body>
</html>
