<div id="alertContainer" class="container mt-3"></div><div class="container py-5"><div class="row justify-content-center"><div class="col-sm-12 col-md-8 col-lg-6"><form class="form-card" onsubmit="registerUser(event)">
<h2 class="text-center mb-4">Registration</h2><label class="form-label">Full Name</label><input id="regName" type="text" class="form-control mb-3" required>
<label class="form-label">Email</label><input type="email" class="form-control mb-3" required><label class="form-label">Mobile Number</label><input type="tel" class="form-control mb-3" required>
<div class="row"><div class="col-sm-12 col-md-6"><label class="form-label">Password</label><input type="password" class="form-control mb-3" required></div><div class="col-sm-12 col-md-6"><label class="form-label">Confirm Password</label><input type="password" class="form-control mb-3" required></div></div>
<label class="form-label">Gender</label><div class="mb-3"><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender" required><label class="form-check-label">Male</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="gender"><label class="form-check-label">Female</label></div></div>
<label class="form-label">Date of Birth</label><input type="date" class="form-control mb-3"><label class="form-label">Address</label><textarea class="form-control mb-3" rows="3"></textarea>
<label class="form-label">Preferred Destination</label><select class="form-select mb-3"><option>Goa</option><option>Manali</option><option>Kashmir</option><option>Kerala</option><option>Jaipur</option><option>Andaman</option><option>Ladakh</option></select>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" required><label class="form-check-label">I accept Terms & Conditions</label></div>
